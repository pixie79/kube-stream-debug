# pulsar-topic-health configuration
#
# Precedence for the admin URL: --admin-url flag > PULSAR_ADMIN_URL env > this file.
# The auth token is env-only: TOKEN first, then PULSAR_TOKEN.

admin_url = "https://pulsar-admin.internal.example.net"
subscription = "my-consumer-subscription"

# A partition whose subscription backlog exceeds this is reported as "hot".
backlog_threshold = 100

# Base topics get a per-partition breakdown via partitioned-stats.
# Explicit -partition-N entries are checked individually.
# "persistent://" is assumed when the scheme is omitted.
topics = [
  "persistent://widgetco/toybox/marbles",
  "persistent://widgetco/toybox/robots",
  "widgetco/toybox/dominoes-partition-7",
]

# Optional colour thresholds for the BACKLOG, SIZE and UNACKED columns.
# A value >= crit renders red, >= warn renders yellow, below warn renders
# green; a column with no thresholds set is left uncoloured. size_* are bytes.
# (Colours show in a terminal; they're stripped when output is piped/redirected,
#  so captured runs stay clean for diffing.)
[colors]
backlog_warn = 100000
backlog_crit = 1000000
size_warn    = 1073741824       # 1 GiB
size_crit    = 5368709120       # 5 GiB
unacked_warn = 50000
unacked_crit = 200000

# Optional Kubernetes correlation (needs a binary built with --features kube).
# Either `--kube` on the CLI or `enabled = true` here activates it; CLI --kube-*
# flags override these values. `assert` checks values in the pods' config.toml.
[kube]
enabled   = true
namespace = "my-ns"
selector  = "app=my-consumer"
configmap = "my-consumer-config"
log_tail  = 200
assert    = { worker_count = "24", batch_size = "30" }

# Optional operational defaults, so a frequently-run configuration doesn't need
# a long command line. Every field is optional; a CLI flag overrides the config
# value. The mode switches (watch/tui/problems_only) can be turned on here or by
# the flag, but neither can force them off.
[settings]
format             = "table"          # or "jsonl"
concurrency        = 8
timeout_secs       = 30
drain_window_secs  = 30               # 0 skips the trend/ETA second sample
watch              = false
tui                = false
watch_interval_secs = 60
json_dir           = "./snapshots"
json_dir_max_files = 100              # 0 keeps all
problems_only      = false

# Optional pod-metrics scraping (requires --kube / the kube feature). When
# enabled, the tool port-forwards to each consumer pod's metrics port, parses
# the Prometheus /metrics, tracks rolling trends, and logs a curated per-pod
# summary each cycle. Set capture_dir to also archive every scraped metric as
# JSONL for later tuning.
[metrics]
enabled     = false
port        = 9090
window      = 5                       # scrapes kept per metric for rolling trend
# capture_dir = "./metrics-capture"   # unset = summarise live, don't archive

# Optionally choose exactly which metrics to monitor. Listing any [[metrics.watch]]
# entries REPLACES the built-in curated set; omit them to use the defaults.
# polarity: "lower_better" | "higher_better" | "neutral". threshold (optional)
# alerts when crossed — above for lower_better, below for higher_better.
# [[metrics.watch]]
# name      = "myapp_pulsar_consumer_lag"
# polarity  = "lower_better"
# threshold = 100000
# label     = "consumer lag"
#
# [[metrics.watch]]
# name      = "myapp_throughput_rate"
# polarity  = "higher_better"
# threshold = 50
